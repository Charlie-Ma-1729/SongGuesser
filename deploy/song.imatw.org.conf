# nginx 設定：song.imatw.org → 本機 127.0.0.1:6713（含 WebSocket）
#
# 這是「第一階段」：只有 80 port。先用它讓 certbot 申請憑證，
# 之後 certbot --nginx 會自動幫你加上 443 與「80 轉 443」的設定（最終樣子見檔案最下面的註解）。
#
# 安裝（Debian / Ubuntu）：
#   sudo cp deploy/song.imatw.org.conf /etc/nginx/sites-available/song.imatw.org
#   sudo ln -s /etc/nginx/sites-available/song.imatw.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# （若你的 nginx 用 conf.d：改成 cp 到 /etc/nginx/conf.d/song.imatw.org.conf，不用 ln）

server {
    listen 80;
    listen [::]:80;
    server_name song.imatw.org;

    # 多人連線（WebSocket）
    location /ws {
        proxy_pass http://127.0.0.1:6713;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 伺服器每 20 秒送心跳，不會被當成閒置
    }

    # 網頁、題庫、/healthz
    location / {
        proxy_pass http://127.0.0.1:6713;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

