<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>題庫預覽與微調</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { text-align: left; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 20px 80px; }
    .bar { position: sticky; top: 0; z-index: 5; background: #14152c; padding: 12px 0; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input[type=search] { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #3a3d70; background: #25274a; color: var(--text); min-width: 220px; }
    .player { width: 320px; aspect-ratio: 16/9; position: fixed; right: 16px; bottom: 16px; z-index: 6; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px #000a; background: #000; }
    .player #yt { width: 100%; height: 100%; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 8px 6px; border-bottom: 1px solid #2c2f5a; vertical-align: middle; font-size: 14px; }
    tr.off { opacity: 0.4; }
    tr.cur { background: rgba(124, 92, 255, 0.18); }
    .num { width: 64px; padding: 6px; border-radius: 8px; border: 1px solid #3a3d70; background: #25274a; color: var(--text); font: inherit; }
    button.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; background: #2c2f5a; }
    .muted { color: var(--muted); }
    a { color: #9fb4ff; }
  </style>
</head>
<body>
<div class="wrap">
  <h1 style="font-size:28px">題庫預覽與微調</h1>
  <p class="muted">試聽每首歌、調整起點秒數、停用有問題的題目。調整結果先存在瀏覽器，按「複製 overrides.json」後貼到 <code>data/overrides.json</code>，再執行 <code>node scripts/build.mjs</code> 即可永久生效。</p>
  <div class="bar">
    <input id="q" type="search" placeholder="搜尋作品 / 歌名 / 歌手">
    <label style="flex-direction:row;align-items:center;gap:6px"><input id="only-changed" type="checkbox"> 只看有調整的</label>
    <label style="flex-direction:row;align-items:center;gap:6px"><input id="only-review" type="checkbox"> 只看需確認的（開頭可能不是音樂）</label>
    <button id="copy" class="ghost">複製 overrides.json</button>
    <span id="count" class="muted"></span>
  </div>
  <table>
    <thead><tr><th></th><th>作品 / 歌名</th><th>類型</th><th>起點(秒)</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div class="player"><div id="yt"></div></div>

<script type="module">
import { ClipPlayer } from './js/player.js';
import { loadBad } from './js/questions.js';

const $ = (id) => document.getElementById(id);
const LS = 'songguesser-overrides-v1';
let bank = [];
let ov = {};       // id -> {start?, disabled?}
let baseOv = {};   // data/overrides.json 現有內容
let cur = null;

try { ov = JSON.parse(localStorage.getItem(LS) || '{}'); } catch { ov = {}; }
const save = () => { try { localStorage.setItem(LS, JSON.stringify(ov)); } catch {} };

const player = new ClipPlayer('yt', {});
await player.init();

const res = await fetch('data/anime.json', { cache: 'no-cache' });
bank = await res.json();
try { baseOv = await (await fetch('data/overrides.json', { cache: 'no-cache' })).json(); } catch { baseOv = {}; }

const idOf = (q) => q.id.replace(/^a-/, '');
// 玩遊戲時按 X 回報的題目，視為「停用」
for (const q of bank) {
  if (loadBad().has(q.id) && !ov[idOf(q)]) ov[idOf(q)] = { disabled: true };
}
const startOf = (q) => ov[idOf(q)]?.start ?? q.start ?? 0;

function render() {
  const kw = $('q').value.trim().toLowerCase();
  const changedOnly = $('only-changed').checked;
  const rows = $('rows');
  rows.innerHTML = '';
  let shown = 0;
  bank.forEach((q) => {
    const a = q.answer;
    const text = `${a.work} ${a.title} ${a.artist || ''}`.toLowerCase();
    if (kw && !text.includes(kw)) return;
    const o = ov[idOf(q)];
    if (changedOnly && !o) return;
    if ($('only-review').checked && !q.review) return;
    shown++;
    const tr = document.createElement('tr');
    if (o?.disabled) tr.classList.add('off');
    if (cur === q.id) tr.classList.add('cur');
    tr.innerHTML = `
      <td><button class="sm" data-act="play">▶</button></td>
      <td><b></b><br><span class="muted"></span></td>
      <td></td>
      <td><input class="num" type="number" min="0" step="1"> <button class="sm" data-act="now" title="把目前播放位置設為起點">⏱ 設為目前位置</button></td>
      <td><button class="sm" data-act="off"></button> <a target="_blank" rel="noopener">YouTube</a></td>`;
    tr.querySelector('b').textContent = a.work;
    tr.querySelector('.muted').textContent = `♪ ${a.title}${a.artist ? ' / ' + a.artist : ''}　｜　影片：${q.video || ''}（${q.channel || ''}）${q.review ? ' ⚠需確認' : ''}${q.startSource === 'peak' ? ' ✓起點取自最多重播' : ''}`;
    tr.children[2].textContent = q.kind;
    const input = tr.querySelector('input');
    input.value = startOf(q);
    input.addEventListener('change', () => {
      ov[idOf(q)] = { ...(ov[idOf(q)] || {}), start: Math.max(0, Number(input.value) || 0) };
      save(); updateCount();
    });
    tr.querySelector('[data-act=off]').textContent = o?.disabled ? '啟用' : '停用';
    tr.querySelector('a').href = 'https://www.youtube.com/watch?v=' + q.ytId + '&t=' + startOf(q);
    tr.addEventListener('click', (e) => {
      const act = e.target.dataset.act;
      if (act === 'play') {
        cur = q.id;
        player.load({ ytId: q.ytId, start: Number(input.value) || 0, duration: 0 });
        document.querySelectorAll('tr.cur').forEach((x) => x.classList.remove('cur'));
        tr.classList.add('cur');
      } else if (act === 'now') {
        if (cur !== q.id) return;
        const t = Math.floor(player.yt.getCurrentTime());
        input.value = t;
        ov[idOf(q)] = { ...(ov[idOf(q)] || {}), start: t };
        save(); updateCount();
      } else if (act === 'off') {
        const d = !ov[idOf(q)]?.disabled;
        ov[idOf(q)] = { ...(ov[idOf(q)] || {}), disabled: d };
        save(); render();
      }
    });
    rows.append(tr);
  });
  updateCount(shown);
}

function updateCount(shown) {
  const changed = Object.keys(ov).length;
  $('count').textContent = `${shown ?? '…'} / ${bank.length} 首　已調整 ${changed} 首`;
}

$('q').addEventListener('input', render);
$('only-changed').addEventListener('change', render);
$('only-review').addEventListener('change', render);
$('copy').addEventListener('click', async () => {
  const merged = { ...baseOv };
  for (const [id, v] of Object.entries(ov)) merged[id] = { ...(merged[id] || {}), ...v };
  const text = JSON.stringify(merged, null, 1);
  try { await navigator.clipboard.writeText(text); alert('已複製！貼到 data/overrides.json 後執行 node scripts/build.mjs'); }
  catch { prompt('請手動複製：', text); }
});

render();
</script>
</body>
</html>
